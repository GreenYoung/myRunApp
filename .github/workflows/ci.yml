name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库里 gradlew 的 git mode 是 100644，Linux runner 上需要显式加执行权限
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties 把 org.gradle.java.home 钉死在本机 Windows 路径上，
      # CI 上必须去掉，否则 Gradle 会去找 D:/Program Files/Android/Android Studio/jbr
      - name: Drop local JDK path
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      # 高德 key 走 local.properties（不入库），CI 用空值即可编译：
      # AndroidManifest 里的 ${AMAP_API_KEY} 占位为空，不影响 build 与单测。
      - name: Build, unit test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
